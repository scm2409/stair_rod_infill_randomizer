# Default parameters for Evolutionary Infill Generator
# A hybrid generator combining uniform directional baseline with iterative mutation
# and fitness-based selection for optimization

# Baseline parameters (same as UniformDirectionalGenerator)
num_rods: 30
num_layers: 3
main_direction_range_min_deg: -45.0
main_direction_range_max_deg: 25.0
min_anchor_distance_cm: 5.0
infill_weight_per_meter_kg_m: 0.59

# Evolutionary parameters
max_iterations: 1000
max_duration_sec: 60.0
improvement_threshold: 0.001
stagnation_limit: 100
max_direction_deviation_deg: 90.0  # Maximum deviation from layer's main direction (degrees)

# Evaluator configuration
# Supported evaluator types: "passthrough", "quality"
# 
# Pass-Through Evaluator (fastest, no optimization):
#   evaluator:
#     type: passthrough
#
# Quality Evaluator (best quality, slower):
#   evaluator:
#     type: quality
#     max_hole_area_cm2: 10000.0
#     hole_uniformity_weight: 0.3
#     incircle_uniformity_weight: 0.2
#     angle_distribution_weight: 0.2
#     anchor_spacing_horizontal_weight: 0.15
#     anchor_spacing_vertical_weight: 0.15
#
# Note: Evaluator parameters are nested in the parameters object, not in config defaults
